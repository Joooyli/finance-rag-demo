<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RAG 数据检查{% endblock %}</title>
<style>
  :root { --line:#e3e8ef; --head:#f3f6fb; --link:#1257a8; --warn:#b42318; --ok:#18794e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Microsoft YaHei", "Segoe UI", Arial, sans-serif; color:#111827; }
  header { display:flex; gap:24px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:5; }
  header strong { font-size:15px; }
  nav { display:flex; gap:16px; font-size:14px; }
  nav a { color:var(--link); text-decoration:none; }
  nav a:hover { text-decoration:underline; }
  main { padding:20px; max-width:1400px; }
  h1 { font-size:20px; margin:0 0 16px; }
  h2 { font-size:16px; margin:24px 0 10px; }
  .cards { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:8px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:12px 16px; min-width:200px; background:#fafbfd; }
  .card .label { font-size:12px; color:#6b7280; }
  .card .value { font-size:18px; font-weight:600; margin-top:4px; word-break:break-all; }
  form.filters { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; margin-bottom:14px; }
  form.filters label { display:flex; flex-direction:column; font-size:12px; color:#6b7280; gap:4px; }
  input, select, button { font:inherit; font-size:13px; padding:6px 8px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; }
  button { cursor:pointer; background:#1257a8; color:#fff; border-color:#1257a8; }
  button.secondary { background:#fff; color:#111827; border-color:#cbd5e1; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border:1px solid var(--line); padding:8px; text-align:left; vertical-align:top; }
  th { background:var(--head); position:sticky; top:49px; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  td.mono, .mono { font-family:Consolas, "Cascadia Mono", monospace; font-size:12px; }
  pre.text { white-space:pre-wrap; overflow-wrap:anywhere; margin:6px 0 0; padding:8px; background:#f8fafc; border:1px solid var(--line); border-radius:6px; max-height:320px; overflow:auto; }
  details summary { cursor:pointer; color:var(--link); font-size:12px; }
  .muted { color:#6b7280; font-size:12px; }
  .warn { color:var(--warn); }
  .ok { color:var(--ok); }
  .pager { display:flex; gap:12px; align-items:center; margin:12px 0; font-size:13px; }
  .pager a { color:var(--link); }
  .badge { display:inline-block; padding:1px 6px; border:1px solid var(--line); border-radius:10px; font-size:11px; background:#fff; }
  tr:target { background:#fffbe6; }
</style>
</head>
<body>
<header>
  <strong>本地金融 PDF RAG 控制台</strong>
  <nav>
    <a href="/ui">概览</a>
    <a href="/ui/chunks">切块</a>
    <a href="/ui/runs">解析记录</a>
    <a href="/docs">API 文档</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
